<!DOCTYPE html>
<html lang="en">

<head>
    <title>CSS-Introduction</title>
    <style>
        .main {
            width: 700px;
            height: 550px;
            border: 1px solid red;
            display: flex;
        }

        .col1 {
            width: 350px;
            height: 550px;
            border: 0.5px solid black;
        }

        .col2 {
            width: 350px;
            height: 550px;
            border: 0.5px solid orange;
        }

        .row1 {
            width: 350px;
            height: 100px;
            display: flex;
        }

        .rc {
            width: 175px;
            height: 100px;
            border: 0.5px solid black;
        }

        .row2 {
            width: 350px;
            height: 100px;
            display: flex;
        }

        .rc2 {
            width: 30%;
            height: 100px;
            border: 0.5px solid black;
        }

        .rcb2 {
            width: 40%;
            height: 100px;
            border: 0.5px solid black;
        }

        .row{
            width: 350px;
            height: 50px;
            border: 0.5px solid black;
        }

        .img{
            width: 350px;
            height: 280px;
            border: 0.5px solid black;
        }

        .col2row2{
            width: 350px;
            height: 150px;
            border: 1px solid red;
            display: flex;
        }

        .col2r2c{
            width: 50%;
            height: 150px;
            border: 0.5px solid black;
        }

        .col2row3{
            width: 350px;
            height: 120px;
            border: 0.5px solid black;
            display: flex;
        }

        .c2r3c{
            width: 33.33%;
            height: 120px;
            border: 0.5px solid black;
        }
    </style>
</head>

<body>


    <div class="main">
        <div class="col1">
            <div class="row1">
                <div class="rc">Home</div>
                <div class="rc">About Us</div>
            </div>

            <div class="row2">
                <div class="rc2">Node.js</div>
                <div class="rcb2">Laravel</div>
                <div class="rc2">Vue.js</div>
            </div>

            <div class="row1">
                <div class="rc">DM</div>
                <div class="rc">Hacking</div>
            </div>

            <div class="row2">
                <div class="rc2">App</div>
                <div class="rcb2">SEO</div>
                <div class="rc2">HTML</div>
            </div>

            <div class="row">Python</div>
            <div class="row">Server</div>
            <div class="row">AWS</div>
        </div>

        <div class="col2">
            <div class="img">
                Image
            </div>


            <div class="col2row2">
                <div class="col2r2c">Image 1</div>
                <div class="col2r2c">Image 2</div>
            </div>

            <div class="col2row3">
                <div class="c2r3c">C</div>
                <div class="c2r3c">C++</div>
                <div class="c2r3c">Java</div>
            </div>
        </div>
    </div>

</body>

</html>
