<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
    </style>
</head>

<body>

</body>

<script>

   for (let i = 0; i <= 5; i++) {
    for (let j = 0; j <= 5; j++) {
        if ( j == 5 || i==0) {
            document.write("*")
        } else {
          document.write("&nbsp;&nbsp;")
        }
    }

    document.write("<br>");
}

</script>

</html>
