<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Responsive Header</title>
	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			background: #f4f7fb;
			color: #172033;
			font-family: Arial, sans-serif;
		}

		.header {
			align-items: center;
			background: #ffffff;
			border-bottom: 1px solid #e5e9f0;
			display: flex;
			justify-content: space-between;
			min-height: 72px;
			padding: 0 7%;
		}

		.logo {
			color: #2563eb;
			font-size: 1.5rem;
			font-weight: 700;
			text-decoration: none;
		}

		.nav-list {
			align-items: center;
			display: flex;
			gap: 2rem;
			list-style: none;
		}

		.nav-list a {
			color: #172033;
			font-size: 0.95rem;
			text-decoration: none;
		}

		.nav-list a:hover {
			color: #2563eb;
		}

		.menu-button,
		.close-button {
			background: transparent;
			border: 0;
			cursor: pointer;
			font-size: 1.8rem;
			line-height: 1;
		}

		.menu-button {
			display: none;
		}

		.side-menu {
			background: #ffffff;
			border-right: 1px solid #e5e9f0;
			box-shadow: 8px 0 24px rgba(23, 32, 51, 0.12);
			display: none;
			height: 100vh;
			left: 0;
			padding: 1.5rem;
			position: fixed;
			top: 0;
			width: min(280px, 82vw);
			z-index: 10;
		}

		.side-menu.is-open {
			display: block;
		}

		.side-menu-header {
			align-items: center;
			display: flex;
			justify-content: space-between;
			margin-bottom: 2.5rem;
		}

		.side-menu-list {
			display: grid;
			gap: 1.25rem;
			list-style: none;
		}

		.side-menu-list a {
			color: #172033;
			display: block;
			font-size: 1.05rem;
			padding: 0.5rem 0;
			text-decoration: none;
		}

		.side-menu-list a:hover {
			color: #2563eb;
		}

		@media (max-width: 700px) {
			.header {
				justify-content: flex-start;
				padding: 0 1.25rem;
			}

			.menu-button {
				display: block;
				margin-right: 1rem;
			}

			.nav-list {
				display: none;
			}
		}
	</style>
</head>
<body>
	<header class="header">
		<button class="menu-button" id="menuButton" type="button" aria-label="Open menu" aria-controls="sideMenu" aria-expanded="false">&#9776;</button>
		<a class="logo" href="#">MyBrand</a>

		<nav aria-label="Main navigation">
			<ul class="nav-list">
				<li><a href="#home">Home</a></li>
				<li><a href="#about">About</a></li>
				<li><a href="#services">Services</a></li>
				<li><a href="#contact">Contact</a></li>
			</ul>
		</nav>
	</header>

	<aside class="side-menu" id="sideMenu" aria-label="Mobile navigation">
		<div class="side-menu-header">
			<a class="logo" href="#">MyBrand</a>
			<button class="close-button" id="closeButton" type="button" aria-label="Close menu">&times;</button>
		</div>
		<ul class="side-menu-list">
			<li><a href="#home">Home</a></li>
			<li><a href="#about">About</a></li>
			<li><a href="#services">Services</a></li>
			<li><a href="#contact">Contact</a></li>
		</ul>
	</aside>

	<script>
		const menuButton = document.getElementById('menuButton');
		const closeButton = document.getElementById('closeButton');
		const sideMenu = document.getElementById('sideMenu');

		function openMenu() {
			sideMenu.classList.add('is-open');
		}

		function closeMenu() {
			sideMenu.classList.remove('is-open');
		}

		menuButton.addEventListener('click', openMenu);
		closeButton.addEventListener('click', closeMenu);
	</script>
</body>
</html>
