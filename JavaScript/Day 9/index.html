<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color-Picker</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        .container {
            width: 350px;
            box-shadow: 0px 0px 10px #ccc;
            background: white;
            margin: 100px auto 0px auto;
            text-align: center;
            line-height: 50px;
            padding: 50px;
        }

        .circel {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: auto;
            background: red;
        }

        button {
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 20px;
            background: none;
        }

        #message {
            color: green;
        }
    </style>
</head>

<body id="body">

    <div class="container">
        <div class="circel" id="colorContainer"></div>

        <input type="color" id="colorpicker" value="#fe0101">

        <div class="colorCode" id="colorCode">
            red
        </div>

        <button onclick="colorCopy()">
            Copy Code
        </button>

        <p id="message"></p>
    </div>

</body>

<script>

    let colorContainer = document.getElementById("colorContainer");
    let colorpicker = document.getElementById("colorpicker");
    let colorCode = document.getElementById("colorCode");
    let body = document.getElementById("body");
    let message = document.getElementById("message");

    colorpicker.addEventListener("input", function () {

        let color = this.value;
         
        colorContainer.style.background = color;
        body.style.background = color;

        colorCode.innerHTML = color.toUpperCase();

    });

    function colorCopy() {

        navigator.clipboard.writeText(colorCode.innerHTML);

        message.innerHTML = `Color Copy ${colorCode.innerHTML}`
    }

</script>

</html>
