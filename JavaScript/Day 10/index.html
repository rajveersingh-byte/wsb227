<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" />
    <title>Contact Form</title>
</head>

<body>
    <main class="page-shell">
        <section class="intro">
            <p class="eyebrow">Get in touch</p>
            <h1>Let’s start a conversation.</h1>
            <p class="intro-text">Share your details and a short message. We’ll get back to you soon.</p>
        </section>

        <section class="content-grid" aria-label="Contact details">
            <form class="contact-form" id="contactform" autocomplete="off">
                <div class="field-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Your full name" />
                    <span id="errormessage" style="color: red;"></span>
                </div>

                <div class="field-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" />
                    <span id="errormessage" style="color: red;"></span>
                </div>

                <div class="field-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" maxlength="10" placeholder="+91 8529637410" />
                    <span id="errormessage" style="color: red;"></span>
                </div>

                <div class="field-group field-group-wide">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6" placeholder="How can we help?" /></textarea>
                </div>

                <button type="submit">Send message <span aria-hidden="true">→</span></button>
            </form>


        </section>
