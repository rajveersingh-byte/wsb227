<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WsCube tech Landing Page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" />
    <link rel="stylesheet" href="asstes/css/style.css" />
    <link rel="stylesheet" href="asstes/css/media.css" />
</head>

<body>

    <header>
        <div class="container">
            <div class="row">
                <div class="logo">
                    <img src="asstes/img/logo.svg" alt="WsCube Tech">
                </div>

                <div class="cta-btn">
                    <button><i class="fa-brands fa-whatsapp"></i> Chat with Us</button>
                    <button>Call Us</button>
                </div>
            </div>

        </div>
    </header>

    <!-- banner section -->

    <section>
        <div class="container">
            <div class="row banner-row">

                <div class="content">
                    <h1>Career Opportunities <br> in <span> Digital Marketing</span></h1>

                    <p>Digital marketing course so good,you only pay-after-placement</p>

                    <ul>
                        <li><img src="asstes/img/frame.png" alt="WsCube" /> Specialization: Performance Marketing</li>
                        <li><img src="asstes/img/frame.png" alt="WsCube" /> Min salary of Rs 4.5 LPA</li>
                        <li><img src="asstes/img/frame.png" alt="WsCube" /> 50 seats only</li>
                    </ul>

                    <div class="btn">
                        <button>Book 2 Days Demo</button>
                        <button><i class="fa-solid fa-download"></i> Download Curriculum</button>
                    </div>
                </div>

                <div class="form-contact">

                    <form>
                        <h2>Contact Us</h2>
                        <div class="form-control">
                            <label>Name</label>
                            <input type="text" placeholder="Enter your name" />
                        </div>

                        <div class="form-control">
                            <label>Email</label>
                            <input type="text" placeholder="Enter your Email" />
                        </div>

                        <div class="form-control">
                            <label>Mobile Number</label>
                            <div class="phone_number">
                                <span>
                                    +91 ▼
                                </span>
                                <input type="tel" maxlength="10" placeholder="Enter your mobile number" />
                            </div>
                        </div>

                        <div class="form-btn">
                            <button>Register Now</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>

</body>

</html>
