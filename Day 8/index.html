<!DOCTYPE html>
<html lang="en">
<head>
    <title>WsCube Tech - Demo Website</title>

    <style>

        .main{
            width: 1000px;
            height: 500px;
            border: 0.5px solid red;
        }

        .row1{
            width: 1000px;
            height: 100px;
            border: 0.5px solid black;
        }


        h1{
            text-align: center;
            font-weight: 400;
            text-transform: uppercase;
            color: blue;
        }

        .row2{
            width: 1000px;
            height: 50px;
            border: 0.2px solid red;
            display: flex;
        }

        .menu{
            width: 250px;
            height: 50px;
            border: 1.1px solid black;
            text-align: center;
            transition: 1.2s;
        }

        .menu:hover{
            cursor: pointer;
            background-color: red;
            color: white;
        }

        .row3{
            width: 1000px;
            height: 200px;
            border: 0.1px solid black;
            display: flex;
        }

        .sidebar{
            width: 250px;
            height: 200px;
        }

        .sidemenu{
            width: 250px;
            height: 40px;
            border: 0.1px solid black;
            text-align: center;
        }

        .banner{
            width: 750px;
            height: 200px;
            border: 0.1px solid black;
        }

        .image{
            width: 100%;
            height: 100%;
        }

        .row4{
            width: 1000px;
            height: 100px;
            display: flex;
        }

        .box{
            width: 333.33px;
            height: 100px;
            border: 0.1px solid red;
        }

        .footer{
            width: 1000px;
            height: 50px;
            text-align: center;
        }

    </style>
</head>
<body>

    <div class="main">

        <div class="row1">
            <h1>WelCome To WsCube Tech</h1>
        </div>

        <div class="row2">
            <div class="menu">Home</div>
            <div class="menu">About Us</div>
            <div class="menu">Services</div>
            <div class="menu">Gallery</div>
            <div class="menu">Contact Us</div>
        </div>

        <div class="row3">

            <div class="sidebar">
                <div class="sidemenu">Home</div>
                <div class="sidemenu">About Us</div>
                <div class="sidemenu">Services</div>
                <div class="sidemenu">Gallery</div>
                <div class="sidemenu">Contact us</div>
            </div>

            <div class="banner">
                <img class="image" src="img/banner.gif" alt="WsCube Tech">
            </div>

        </div>


        <div class="row4">
            <div class="box">Image 1</div>
            <div class="box">Image 2</div>
            <div class="box">Image 3</div>
        </div>

        <div class="footer">
            Home | About | Services | Gallery | Contact us
        </div>

    </div>
    
</body>
</html>
